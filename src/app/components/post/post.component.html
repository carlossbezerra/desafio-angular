<div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-6">Lista de Posts</h1>

    <!-- Botão para criar novo post -->
    <button
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow-md transition-all duration-300 mb-4"
        (click)="openCreateModal()">
        Criar Novo Post
    </button>

    <!-- Tabela de Posts -->
    <div class="overflow-x-auto">
        <table class="table-auto w-full text-left border-collapse border border-gray-300 shadow-md rounded-lg">
            <thead>
                <tr class="bg-gray-100">
                    <th class="border px-4 py-2 font-medium text-gray-700">ID</th>
                    <th class="border px-4 py-2 font-medium text-gray-700">Título</th>
                    <th class="border px-4 py-2 font-medium text-gray-700">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr
                    *ngFor="let post of posts"
                    class="hover:bg-gray-50 transition-colors duration-200">
                    <td class="border px-4 py-2 text-gray-600">{{ post.id }}</td>
                    <td class="border px-4 py-2 text-gray-600">{{ post.title }}</td>
                    <td class="border px-4 py-2">
                        <div class="flex space-x-2">
                            <button
                                class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded shadow-sm transition-all duration-300"
                                (click)="openEditModal(post)">
                                Editar
                            </button>
                            <button
                                class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded shadow-sm transition-all duration-300"
                                (click)="deletePost(post.id)">
                                Excluir
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal de Criação/Edição -->
    <div
        *ngIf="isModalOpen"
        class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded shadow-lg w-full max-w-lg">
            <h2 class="text-xl font-bold text-gray-800 mb-4">
                {{ modalTitle }}
            </h2>
            <form (ngSubmit)="submitForm()">
                <div class="mb-4">
                    <label for="title" class="block font-medium text-gray-700 mb-2">Título</label>
                    <input
                        id="title"
                        type="text"
                        [(ngModel)]="selectedPost.title"
                        name="title"
                        class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring focus:ring-blue-200 transition-all duration-300"
                        required>
                </div>
                <div class="mb-4">
                    <label for="body" class="block font-medium text-gray-700 mb-2">Conteúdo</label>
                    <textarea
                        id="body"
                        [(ngModel)]="selectedPost.body"
                        name="body"
                        class="w-full border border-gray-300 px-4 py-2 rounded focus:outline-none focus:ring focus:ring-blue-200 transition-all duration-300"
                        required></textarea>
                </div>
                <div class="flex justify-end space-x-2">
                    <button
                        type="button"
                        class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded transition-all duration-300"
                        (click)="closeModal()">
                        Cancelar
                    </button>
                    <button
                        type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded shadow-md transition-all duration-300">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
